[package]
name = "cutout_tool"
version = "1.2.0"
edition = "2024"
description = "框构 —— 图片与视频抠图去背工具（10 种抠底模式 + 独立视频/GIF 工作区，支持 FFmpeg 透明视频导出）"

[dependencies]
arboard = "3.7.0"
eframe = { version = "0.37.0", features = ["persistence"] }
image = "0.25.10"
rfd = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
